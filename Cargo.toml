[package]
name = "etlbot"
version = "0.1.0"
authors = ["belst <git@bel.st>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
irc = "1.1.0"
tokio = { version = "1.49", features = ["full" ] }
futures = "0.3"
structopt = "0.3"
anyhow = "1.0"
serde = "1.0"
toml = "1.0"
regex = "1.12"
lazy_static = "1.4"
reqwest =  { version = "0.13", features = ["json", "rustls"] }
twilight-cache = "0.0.0"
twilight-command-parser = "0.9.0"
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-model = "0.17.1"
tracing = "0.1.44"
log = "0.4.29"
tracing-subscriber = { version = "0.3.22", features = ["fmt"] }
